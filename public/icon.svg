<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square, deep slate -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0f172a"/>

  <!-- Heart path, amber -->
  <path d="M256 390
    C256 390 110 290 110 185
    C110 138 148 102 196 102
    C220 102 242 114 256 133
    C270 114 292 102 316 102
    C364 102 402 138 402 185
    C402 290 256 390 256 390Z"
    fill="#f59e0b"/>

  <!-- Lock body: white rounded rectangle centred on heart -->
  <rect x="216" y="230" width="80" height="68" rx="12" ry="12" fill="#0f172a"/>

  <!-- Lock shackle: white arc -->
  <path d="M236 230 L236 210 A20 20 0 0 1 276 210 L276 230"
    fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>

  <!-- Keyhole: amber circle + teardrop -->
  <circle cx="256" cy="260" r="10" fill="#f59e0b"/>
  <rect x="251" y="268" width="10" height="16" rx="5" fill="#f59e0b"/>
</svg>
